name: Deploy

# Publishes the site to GitHub Pages, but only after the full CI workflow has
# passed on that exact commit. It runs on every push to main, and is also
# called by data.yml whenever new orbital data has been published.
#
# The orbital data is not part of the source code. It lives on the `data`
# branch and is copied into the built site here, under data/.
#
# One-time setup in the repository: Settings -> Pages -> Build and deployment
# -> Source: "GitHub Actions".
on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Never run two deployments at once, and never cancel one that is in progress
# (a half-finished deployment is worse than a slightly delayed one).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build the site
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies exactly as locked
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Add the published orbital data
        run: |
          set -euo pipefail
          status=0
          git ls-remote --exit-code --heads origin data > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch --depth=1 origin data
            mkdir -p dist/data
            git archive FETCH_HEAD | tar -x -C dist/data
            ls -l dist/data
          elif [ "$status" -eq 2 ]; then
            echo "::notice::There is no data branch yet. The site is being deployed without orbital data."
          else
            echo "::error::Could not query the repository for the data branch (git exit code $status)."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
