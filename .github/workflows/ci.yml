name: CI

# Runs every check on pull requests and on pushes to any branch except main.
# Pushes to main are handled by deploy.yml, which calls this workflow first
# (via workflow_call) and deploys only if it passes.
on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies exactly as locked
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Initial-download size budget
        run: npm run size

      - name: Install the browser used by the smoke tests
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run e2e

      - name: Keep the Playwright report if anything failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore
